# 部署说明：
# 1. 将本文件复制到服务器，例如：/etc/nginx/sites-available/zeon14.com
# 2. 隐私页：sudo mkdir -p /var/www/zeon14/static
#            sudo cp privacy-policy.html /var/www/zeon14/static/privacy-policy.html
#            sudo chown -R www-data:www-data /var/www/zeon14/static
# 3. sudo ln -sf /etc/nginx/sites-available/zeon14.com /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
# 访问：https://zeon14.com/privacy-policy.html

server {
    server_name zeon14.com www.zeon14.com;

    client_max_body_size 50M;

    # 隐私政策（静态 HTML，不走后端 8666）
    location = /privacy-policy.html {
        root /var/www/zeon14/static;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }

    # 短链接：/privacy -> 隐私政策页
    location = /privacy {
        return 301 https://$host/privacy-policy.html;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:8666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zeon14.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zeon14.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.zeon14.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = zeon14.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name zeon14.com www.zeon14.com;
    return 404; # managed by Certbot
}
